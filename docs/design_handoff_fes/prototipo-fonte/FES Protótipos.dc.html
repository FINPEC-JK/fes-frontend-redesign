<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/finpec-design-system-f2149bfe-f668-44a4-8d88-3a02dff94a5c/tokens/fonts.css">
<link rel="stylesheet" href="_ds/finpec-design-system-f2149bfe-f668-44a4-8d88-3a02dff94a5c/tokens/colors.css">
<link rel="stylesheet" href="_ds/finpec-design-system-f2149bfe-f668-44a4-8d88-3a02dff94a5c/tokens/typography.css">
<link rel="stylesheet" href="_ds/finpec-design-system-f2149bfe-f668-44a4-8d88-3a02dff94a5c/tokens/spacing.css">
<link rel="stylesheet" href="_ds/finpec-design-system-f2149bfe-f668-44a4-8d88-3a02dff94a5c/tokens/base.css">
<link rel="stylesheet" href="_ds/finpec-design-system-f2149bfe-f668-44a4-8d88-3a02dff94a5c/components/finpec-components.css">
<link rel="stylesheet" href="_ds/finpec-design-system-f2149bfe-f668-44a4-8d88-3a02dff94a5c/styles.css">
<script src="_ds/finpec-design-system-f2149bfe-f668-44a4-8d88-3a02dff94a5c/_ds_bundle.js"></script>
<link rel="icon" type="image/png" href="assets/pwa/favicon-32.png">
<style>
html, body { margin: 0; background: #F4F2EE; }
a { color: var(--primary); text-decoration: none; font-weight: 600; }
a:hover { color: var(--primary-hover); text-decoration: underline; }
</style>
</helmet>
<div data-screen-label="FES Protótipos" style="min-height:100vh;box-sizing:border-box;background:var(--bg);padding:32px 32px 64px;display:flex;flex-direction:column;gap:20px">
  <div style="max-width:1440px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <img src="assets/finpec-mark.png" alt="" style="height:24px;width:auto">
      <span style="font:700 13px/1 var(--font-display);letter-spacing:0.18em;color:var(--ink)">FINPEC</span>
      <span style="font:700 11px/1 var(--font-ui);letter-spacing:0.14em;text-transform:uppercase;color:var(--faint)">Execution System · {{ eyebrow }}</span>
    </div>
    <div>
      <h1 style="font:700 26px/1.15 var(--font-display);letter-spacing:-0.02em;color:var(--ink);margin:0">{{ title }}</h1>
      <p style="color:var(--muted);font-size:14px;margin:6px 0 0;max-width:720px;text-wrap:pretty">{{ desc }}</p>
    </div>
    <div style="display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)">
      <span style="font:600 12.5px/1 var(--font-ui);color:var(--ink-2)">{{ layoutLabel }}</span>
      <span style="color:var(--faint)">·</span>
      <span>{{ resLabel }}</span>
      <span style="color:var(--faint)">·</span>
      <span>{{ perfilLabel }}</span>
      <span style="color:var(--faint)">·</span>
      <span style="font:500 12px/1 var(--font-mono)">{{ sizeTxt }}</span>
      <span style="color:var(--faint)">Troque layout, resolução e perfil no painel Tweaks.</span>
    </div>
  </div>
  <div ref="{{ stageRef }}" style="width:100%;max-width:1440px;margin:0 auto">
    <div style="width:{{ boxW }};height:{{ boxH }};margin:0 auto;position:relative">
      <div style="position:absolute;left:0;top:0;width:{{ rawW }};height:{{ rawH }};transform:scale({{ scale }});transform-origin:0 0">
        <sc-if value="{{ isBrowser }}" hint-placeholder-val="{{ true }}">
          <div style="border-radius:12px;box-shadow:var(--shadow-lg)">
            <x-import component-from-global-scope="ChromeWindow" from="./browser-window.jsx" width="{{ cur.w }}" height="{{ frameH }}" url="fes.finpec.com.br" tabs="{{ tabs }}" hint-size="100%,640px">
              <iframe ref="{{ frameRef }}" onLoad="{{ onFrameLoad }}" src="{{ src }}" title="FES" style="display:block;width:100%;height:100%;border:0"></iframe>
            </x-import>
          </div>
        </sc-if>
        <sc-if value="{{ isPhone }}" hint-placeholder-val="{{ false }}">
          <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" hint-size="402px,874px">
            <div style="height:100%;padding-top:54px;box-sizing:border-box;background:var(--surface)">
              <iframe ref="{{ frameRef }}" onLoad="{{ onFrameLoad }}" src="{{ src }}" title="FES · PWA" style="display:block;width:100%;height:100%;border:0"></iframe>
            </div>
          </x-import>
        </sc-if>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Web&quot;,&quot;Web responsive&quot;,&quot;PWA&quot;],&quot;default&quot;:&quot;Web responsive&quot;,&quot;tsType&quot;:&quot;\&quot;Web\&quot; | \&quot;Web responsive\&quot; | \&quot;PWA\&quot;&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;resolucaoWeb&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Desktop · 1440&quot;,&quot;Notebook · 1280&quot;],&quot;default&quot;:&quot;Desktop · 1440&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Resolução · Web&quot;},&quot;resolucaoResponsive&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Desktop · 1440&quot;,&quot;Notebook · 1280&quot;,&quot;Tablet horizontal · 1180&quot;,&quot;Tablet · 834&quot;,&quot;Celular · 390&quot;],&quot;default&quot;:&quot;Celular · 390&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Resolução · Web responsive&quot;},&quot;perfil&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;CEO&quot;,&quot;Diretor&quot;],&quot;default&quot;:&quot;CEO&quot;,&quot;tsType&quot;:&quot;\&quot;CEO\&quot; | \&quot;Diretor\&quot;&quot;,&quot;section&quot;:&quot;Simulação&quot;}}">
class Component extends DCLogic {
  state = { avail: 1200 };
  stageRef = React.createRef();
  frameRef = React.createRef();
  componentDidMount() {
    this._m = () => { const el = this.stageRef.current; if (el && el.clientWidth !== this.state.avail) this.setState({ avail: el.clientWidth }); };
    this._m();
    window.addEventListener('resize', this._m);
    if (typeof ResizeObserver !== 'undefined' && this.stageRef.current) { this._ro = new ResizeObserver(this._m); this._ro.observe(this.stageRef.current); }
  }
  kick() {
    [60, 250].forEach(t => setTimeout(() => { const f = this.frameRef.current; try { if (f && f.contentWindow) f.contentWindow.dispatchEvent(new Event('resize')); } catch (e) {} }, t));
  }
  componentWillUnmount() { window.removeEventListener('resize', this._m); if (this._ro) this._ro.disconnect(); }
  renderVals() {
    const RES = [
      { id: 'desk', label: 'Desktop · 1440', w: 1440, h: 860 },
      { id: 'lap', label: 'Notebook · 1280', w: 1280, h: 780 },
      { id: 'tabl', label: 'Tablet horizontal · 1180', w: 1180, h: 780 },
      { id: 'tab', label: 'Tablet · 834', w: 834, h: 1000 },
      { id: 'cel', label: 'Celular · 390', w: 390, h: 780 }
    ];
    const L = this.props.layout || 'Web responsive';
    const mode = L === 'PWA' ? 'pwa' : L === 'Web' ? 'web' : 'responsive';
    const perfil = this.props.perfil === 'Diretor' ? 'DIRECTOR' : 'CEO';
    let cur, chrome = 84;
    if (mode === 'pwa') { cur = { label: 'iPhone · 402', w: 402, h: 874 }; chrome = 0; }
    else if (mode === 'web') cur = RES.find(x => x.label === this.props.resolucaoWeb) || RES[0];
    else cur = RES.find(x => x.label === this.props.resolucaoResponsive) || RES[4];
    const key = mode + cur.w;
    if (this._lastKey !== key) { const first = this._lastKey == null; this._lastKey = key; if (!first) this.kick(); }
    const frameH = cur.h + chrome, scale = Math.min(1, Math.max(0.2, (this.state.avail || cur.w) / cur.w));
    const T = {
      web: ['Web', 'FES na web', 'Layout de desktop com menu lateral completo, tabelas densas e painéis recolhíveis para dar mais espaço aos dados.'],
      responsive: ['Web responsive', 'FES no navegador, em qualquer largura', 'O site se adapta à tela sem virar aplicativo: menu lateral recolhido no tablet, menu sanduíche no celular, tabelas que viram cartões e painéis recolhíveis.'],
      pwa: ['App mobile (PWA)', 'FES como aplicativo instalado', 'Barra de navegação inferior, tela cheia, painéis que sobem da base, aviso de instalação e funcionamento offline.']
    }[mode];
    return {
      eyebrow: T[0], title: T[1], desc: T[2], layoutLabel: T[0], resLabel: cur.label,
      perfilLabel: perfil === 'CEO' ? 'CEO · Fernando Sartori' : 'Diretor · Joao Kraemer',
      isBrowser: mode !== 'pwa', isPhone: mode === 'pwa',
      cur, frameH, scale, stageRef: this.stageRef, frameRef: this.frameRef, onFrameLoad: () => this.kick(),
      rawW: cur.w + 'px', rawH: frameH + 'px', boxW: Math.round(cur.w * scale) + 'px', boxH: Math.round(frameH * scale) + 'px',
      sizeTxt: cur.w + ' × ' + cur.h + (scale < 1 ? ' · exibido a ' + Math.round(scale * 100) + '%' : ''),
      src: 'FES Redesign.dc.html?layout=' + mode + '&perfil=' + perfil,
      tabs: [{ title: 'FES · FINPEC Execution System' }]
    };
  }
}
</script>
</body>
</html>
