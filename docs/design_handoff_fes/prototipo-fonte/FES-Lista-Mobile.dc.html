<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/finpec-design-system-f2149bfe-f668-44a4-8d88-3a02dff94a5c/tokens/fonts.css">
<link rel="stylesheet" href="_ds/finpec-design-system-f2149bfe-f668-44a4-8d88-3a02dff94a5c/tokens/colors.css">
<link rel="stylesheet" href="_ds/finpec-design-system-f2149bfe-f668-44a4-8d88-3a02dff94a5c/tokens/typography.css">
<link rel="stylesheet" href="_ds/finpec-design-system-f2149bfe-f668-44a4-8d88-3a02dff94a5c/tokens/spacing.css">
<link rel="stylesheet" href="_ds/finpec-design-system-f2149bfe-f668-44a4-8d88-3a02dff94a5c/tokens/base.css">
<link rel="stylesheet" href="_ds/finpec-design-system-f2149bfe-f668-44a4-8d88-3a02dff94a5c/components/finpec-components.css">
<link rel="stylesheet" href="_ds/finpec-design-system-f2149bfe-f668-44a4-8d88-3a02dff94a5c/styles.css">
<script src="_ds/finpec-design-system-f2149bfe-f668-44a4-8d88-3a02dff94a5c/_ds_bundle.js"></script>
</helmet>
<div style="display:flex;flex-direction:column;width:100%">
  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
    <div style="display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--ink-2)">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
        <div style="flex:1;min-width:0">{{ r.head }}</div>
        <sc-if value="{{ r.hasAct }}" hint-placeholder-val="{{ false }}"><div style="flex:0 0 auto">{{ r.act }}</div></sc-if>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px">
        <sc-for list="{{ r.fields }}" as="f" hint-placeholder-count="4">
          <div style="display:flex;flex-direction:column;gap:4px;min-width:0;grid-column:{{ f.span }}">
            <span style="font:700 10px/1.2 var(--font-ui);letter-spacing:0.12em;text-transform:uppercase;color:var(--faint)">{{ f.k }}</span>
            <div style="min-width:0;overflow-wrap:anywhere">{{ f.v }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:400},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;Array&lt;{ id: string; head: React.ReactNode; act?: React.ReactNode; hasAct: boolean; fields: Array&lt;{ id: string; k: React.ReactNode; v: React.ReactNode; span: string }&gt; }&gt;&quot;}}"></script>
</body>
</html>
